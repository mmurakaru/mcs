name: ci

# Build and test on every pull request and on pushes to main.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"

      - name: Install dune
        run: opam install dune --yes

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune test
